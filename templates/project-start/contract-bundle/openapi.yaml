openapi: 3.0.3
info:
  title: Project API
  version: 0.1.0
  description: Replace with project-specific API description.
servers:
  - url: http://localhost:8080/api/v1
paths: {}
components:
  schemas:
    ApiResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

